name: Feature request
description: Suggest a new capability or an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first.
        For security problems, use SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour or API you would like. Include request and response examples if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API compatibility
        - Provider or model support
        - Authentication
        - Login and accounts
        - Web UI
        - Docker and deployment
        - Documentation
        - Other
    validations:
      required: true
