# Build the image from this checkout. For the prebuilt image use docker-compose.yml.
services:
  zed-proxy:
    build: .
    image: zed-proxy:0.3.2
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      ZED_API_HOST: 0.0.0.0
      ZED_API_PORT: "8001"
      ZED_DATA_DIR: /data
      ZED_API_KEY: ${ZED_API_KEY:?set ZED_API_KEY in .env first}
    healthcheck:
      test: ["CMD", "/usr/local/bin/zed-proxy", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
